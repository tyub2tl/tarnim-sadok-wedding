<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarnim & Sadok</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 50% 35%, #7b2638 0%, #591323 45%, #3b0914 100%);
  color: #f7efe2;
}

/* OPENING SCREEN */

.opening {
  height: 100svh;
  min-height: 650px;
  width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
}

.opening::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .18;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 7px,
      rgba(255,255,255,.05) 8px
    );
}

.intro {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.small-title {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #d7bd83;
  margin-bottom: 25px;
}

.names {
  font-size: 37px;
  font-weight: normal;
  margin: 0 0 30px;
  color: #fff8ed;
  letter-spacing: 1px;
}

/* ENVELOPE */

.envelope-wrapper {
  position: relative;
  width: min(88vw, 390px);
  height: 250px;
  margin: 0 auto;
  perspective: 1200px;
}

.envelope {
  position: absolute;
  inset: 0;
  border-radius: 4px;
  background: #651429;
  box-shadow:
    0 30px 55px rgba(20,0,5,.45),
    inset 0 0 35px rgba(255,255,255,.035);
}

/* envelope side folds */

.envelope::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  clip-path: polygon(0 0, 51% 57%, 100% 0, 100% 100%, 0 100%);
  background:
    linear-gradient(
      145deg,
      #762039 0%,
      #591020 48%,
      #6c182e 100%
    );
}

/* bottom fold */

.envelope::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 65%;
  z-index: 3;
  clip-path: polygon(0 100%, 50% 20%, 100% 100%);
  background: #5d1125;
}

/* top flap */

.flap {
  position: absolute;
  z-index: 5;
  top: 0;
  left: 0;
  width: 100%;
  height: 64%;
  transform-origin: top center;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background:
    linear-gradient(160deg, #7a2038, #54101f);
  transition: transform 1.1s cubic-bezier(.65,0,.25,1);
}

/* subtle gold edge */

.gold-line {
  position: absolute;
  z-index: 4;
  left: 10%;
  right: 10%;
  bottom: 12%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(207,170,91,.65),
    transparent
  );
}

/* WAX SEAL */

.seal {
  position: absolute;
  z-index: 10;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  border: 2px solid #e1c274;

  background:
    radial-gradient(
      circle at 35% 28%,
      #f1d68c,
      #b78b38 38%,
      #87601e 68%,
      #d1aa53 100%
    );

  box-shadow:
    0 7px 15px rgba(0,0,0,.35),
    inset 0 0 0 5px rgba(111,73,20,.25),
    inset 0 0 8px rgba(255,255,255,.5);

  display: flex;
  align-items: center;
  justify-content: center;

  color: #5c3b13;
  font-size: 26px;
  letter-spacing: -2px;

  cursor: pointer;
  transition:
    transform .35s ease,
    opacity .45s ease;
}

.seal::after {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(92,59,19,.55);
  border-radius: 50%;
}

.seal:active {
  transform: translate(-50%, -50%) scale(.93);
}

.tap {
  margin-top: 34px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: #ddc99a;
}

.arabic {
  margin-top: 10px;
  font-size: 16px;
  color: #f4e5c5;
}

/* OPEN ANIMATION */

.opening.open .flap {
  transform: rotateX(180deg);
}

.opening.open .seal {
  opacity: 0;
  transform: translate(-50%, -30%) scale(.7);
  pointer-events: none;
}

.opening.open .tap,
.opening.open .arabic {
  opacity: 0;
  transition: opacity .4s ease;
}

/* temporary invitation preview */

.invitation {
  min-height: 100svh;
  background: #f3eadb;
  color: #5b382c;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 25px;
}

.invitation-inner {
  max-width: 500px;
}

.monogram {
  color: #a7803e;
  letter-spacing: 3px;
  font-size: 18px;
}

.invitation h1 {
  font-weight: normal;
  font-size: 48px;
  margin: 20px 0;
  color: #651429;
}

.invitation p {
  line-height: 1.8;
  font-size: 14px;
  letter-spacing: 1px;
}

</style>
</head>

<body>

<section class="opening" id="opening">

  <div class="intro">

    <div class="small-title">
      Our Wedding Invitation
    </div>

    <h1 class="names">
      Tarnim &amp; Sadok
    </h1>

    <div class="envelope-wrapper">

      <div class="envelope">

        <div class="flap"></div>

        <div class="gold-line"></div>

        <button
          class="seal"
          id="seal"
          aria-label="Open invitation">
          TS
        </button>

      </div>

    </div>

    <div class="tap">
      Tap the seal to open
    </div>

    <div class="arabic" dir="rtl">
      اضغطوا على الختم لفتح الدعوة
    </div>

  </div>

</section>


<section class="invitation" id="invitation">

  <div class="invitation-inner">

    <div class="monogram">
      T · S
    </div>

    <h1>
      Tarnim &amp; Sadok
    </h1>

    <p>
      TOGETHER WITH OUR FAMILIES<br>
      WE JOYFULLY INVITE YOU<br>
      TO CELEBRATE OUR WEDDING
    </p>

    <p>
      24 — 27 MARCH 2027
    </p>

  </div>

</section>


<script>

const opening = document.getElementById("opening");
const seal = document.getElementById("seal");
const invitation = document.getElementById("invitation");

seal.addEventListener("click", function () {

  opening.classList.add("open");

  setTimeout(function () {

    invitation.scrollIntoView({
      behavior: "smooth"
    });

  }, 900);

});

</script>

</body>
</html>
